# Golden-set retrieval benchmark — runs on PRs; fails if too few queries hit expected files.
# Requires docker compose stack + ingest of examples/small-repo (matches benchmarks/golden/ci_small_repo.json).

name: Retrieval benchmark

on:
  pull_request:
    branches: [main, master, develop, remove-mock-llm]
  push:
    branches: [main, master, develop, remove-mock-llm]
  workflow_dispatch:

jobs:
  golden-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Resolve docker compose command
        id: compose
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "cmd=docker compose" >> "$GITHUB_OUTPUT"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "cmd=docker-compose" >> "$GITHUB_OUTPUT"
          else
            echo "Neither 'docker compose' nor 'docker-compose' is available" >&2
            exit 1
          fi

      - name: Stage small-repo for connector volume
        run: |
          mkdir -p data/repos
          rm -rf data/repos/small-repo
          cp -a examples/small-repo data/repos/small-repo
          # Connector mounts ./data/repos -> /app/repos
          test -f data/repos/small-repo/README.md

      - name: Build and start retrieval stack
        run: |
          # Only the services required for ingest + query (skip dashboard/mcp/remote-agent).
          ${{ steps.compose.outputs.cmd }} up -d --build \
            api_gateway vector-index preprocessor connector web-fetcher terminal-executor
          echo "Waiting for health..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/health >/dev/null \
              && curl -sf http://localhost:8002/health >/dev/null; then
              echo "gateway+connector healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway/connector did not become healthy in time" >&2
          ${{ steps.compose.outputs.cmd }} logs
          exit 1

      - name: Ingest small-repo example
        run: |
          curl -sf -X POST "http://localhost:8080/ingest" \
            -H "Content-Type: application/json" \
            -d '{"path": "/app/repos/small-repo", "recursive": true}' \
            || (${{ steps.compose.outputs.cmd }} logs && exit 1)

      - name: Run golden benchmark
        id: bench
        run: |
          python scripts/run_retrieval_benchmark.py \
            --gateway http://localhost:8080 \
            --golden benchmarks/golden/ci_small_repo.json \
            --output-dir benchmark-out \
            --html benchmark-out/report.html \
            --min-queries-passing 1 \
            --fail-under-mean-recall 0.25

      - name: Append summary to job log
        if: always()
        run: |
          if [ -f benchmark-out/benchmark-summary.md ]; then
            cat benchmark-out/benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: |
            benchmark-out/benchmark-results.json
            benchmark-out/benchmark-summary.md
            benchmark-out/report.html

      - name: Stop stack
        if: always()
        run: ${{ steps.compose.outputs.cmd }} down -v || true
