name: ContextForge CI

on:
  push:
    branches: [ main, master, develop, remove-mock-llm ]
  pull_request:
    branches: [ main, master, develop, remove-mock-llm ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ curl

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Python linting (critical)
      run: |
        flake8 services/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run focused Python tests
      run: |
        pytest tests/test_prompt_enhance_api.py tests/test_prompt_enhancer.py -v --tb=short

  test-vscode-extension:
    name: VS Code Extension Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: vscode-extension/package-lock.json

    - name: Install extension dependencies
      working-directory: vscode-extension
      run: npm ci

    - name: Run extension linting
      working-directory: vscode-extension
      run: npm run lint

    - name: Compile extension
      working-directory: vscode-extension
      run: npm run compile

    - name: Run composer unit tests
      working-directory: vscode-extension
      run: npm run test:unit

    - name: Package extension
      working-directory: vscode-extension
      continue-on-error: true
      run: npm run package

    - name: Upload extension package
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vscode-extension
        path: vscode-extension/*.vsix
        if-no-files-found: ignore

  test-scripts:
    name: Script Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Test script syntax
      run: |
        python -m py_compile scripts/ingest_example.py
        python -m py_compile scripts/query_example.py
        python -m py_compile scripts/test_llm.py

    - name: Test script help output
      run: |
        python scripts/ingest_example.py --help
        python scripts/query_example.py --help
        python scripts/test_llm.py --help

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r services/ scripts/ -f json -o bandit-report.json || true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore
